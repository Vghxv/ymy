<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ymy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="update" class="update" hidden>
    <a id="update-text" class="update-text" href="#" title="See what's new"></a>
    <button id="update-action" class="action update-action" type="button">Update</button>
  </div>
  <section id="playlist" class="playlist" hidden>
    <div class="playlist-text">
      <div id="playlist-title" class="playlist-title"></div>
      <div id="playlist-status" class="playlist-status"></div>
    </div>
    <button id="playlist-dismiss" class="link" type="button" hidden>Dismiss</button>
    <button id="playlist-action" class="action" type="button"></button>
  </section>
  <main id="card" class="card" data-state="idle">
    <div class="head">
      <div id="title" class="title"></div>
      <span id="saved" class="saved" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>
        In folder
      </span>
      <button id="manager" class="icon-button" type="button" title="Open the download manager" aria-label="Open the download manager">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
      </button>
      <button id="open" class="icon-button" type="button" title="Open the download folder" aria-label="Open the download folder">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.5v8h13v-6.5h-6.5l-1.5-1.5z"/></svg>
      </button>
    </div>
    <div class="bar"><div id="fill" class="fill"></div></div>
    <div class="row">
      <span id="status" class="status"></span>
      <button id="check" class="action" type="button" title="Search the download folder for this track" hidden>Check folder</button>
      <button id="action" class="action" type="button" hidden>Download</button>
    </div>
  </main>
  <section id="history" class="history" hidden>
    <div class="history-head">
      <span>Recent downloads</span>
      <button id="clear" class="link" type="button" title="Remove finished and failed downloads from this list">Clear</button>
    </div>
    <ul id="list" class="list"></ul>
  </section>
  <template id="item">
    <li class="item">
      <div class="item-head">
        <a class="item-title" href="#"></a>
        <button class="icon-button item-folder" type="button" title="Show in folder" aria-label="Show in folder" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.5v8h13v-6.5h-6.5l-1.5-1.5z"/></svg>
        </button>
        <button class="action item-retry" type="button" hidden>Retry</button>
      </div>
      <div class="bar"><div class="fill"></div></div>
      <div class="item-status"></div>
    </li>
  </template>
  <script type="module" src="popup.js"></script>
</body>
</html>
