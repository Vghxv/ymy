[tool.poetry]
name = "ymy"
version = "1.0.3"
description = "Native messaging helper that saves YouTube Music audio you have the rights to as MP3 files."
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
yt-dlp = { version = "2026.10.21", extras = ["default"] }

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"
